const parseMY = label => {
  const nums=(String(label).match(/\d+/g)||[]).map(Number);
  return{m:nums.find(n=>n>=1&&n<=12)??nums[0]??null,y:nums.find(n=>n>31)??null};
};
const shortMonth = label => String(label).replace(/\s*-?\s*\d{4}\s*$/, "").trim();
const sortRecs = rs => [...rs].sort((a,b)=>{
  const A=parseMY(a.month),B=parseMY(b.month);
  return(A.y||0)-(B.y||0)||(A.m||0)-(B.m||0);
});
const migrate = list => list.map(r => {
  const{installment,reserve,...rest}=r;
  const month=SEED_MONTHS[rest.id]||rest.month;

    const v=Number(installment)||0;const loan=v>=20000?20000:0;
    return{...rest,month,loan,codes:v-loan};
  }
  return{...rest,month,loan:Number(rest.loan)||0,codes:Number(rest.codes)||0};
});

function MiniAreaChart({data,color,label}){
  const wrapRef=React.useRef(null);
  const [cw,setCw]=React.useState(0);
  React.useEffect(()=>{
    if(!wrapRef.current)return;
    const el=wrapRef.current;
    setCw(el.offsetWidth||el.parentElement.offsetWidth||320);
    const ro=new ResizeObserver(entries=>{
      const w=entries[0].contentRect.width;
      if(w>0)setCw(w);
    });
    ro.observe(el);
    return()=>ro.disconnect();
  },[]);
  if(!data||!data.length)return React.createElement("div",{className:"th-chart-empty"},"مفيش بيانات للعرض");
  if(!cw)return React.createElement("div",{ref:wrapRef,style:{minHeight:250,width:"100%"}});
  const minPtW=60;
  const W=Math.max(cw,data.length*minPtW),H=250,padX=26,padTop=34,padBot=34;
  const innerW=W-padX*2,innerH=H-padTop-padBot;
  const vals=data.map(d=>d.value);
  const max=Math.max(...vals,0),min=Math.min(...vals,0);
  const range=max-min||1;
  const x=i=>padX+(data.length===1?innerW/2:i/(data.length-1)*innerW);
  const y=v=>padTop+innerH-(v-min)/range*innerH;
  const pts=data.map((d,i)=>[x(i),y(d.value)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+pts[pts.length-1][0].toFixed(1)+" "+(padTop+innerH)+" L"+pts[0][0].toFixed(1)+" "+(padTop+innerH)+" Z";
  const fmtK=v=>Math.abs(v)>=1000?Math.round(v/1000)+"k":String(v);
  const gid="g_"+color.replace(/[^a-z0-9]/gi,"");
  return React.createElement("div",{ref:wrapRef,style:{width:"100%",overflowX:W>cw?"auto":"visible"}},
    React.createElement("svg",{width:W,height:H,viewBox:"0 0 "+W+" "+H,style:{display:"block"}},
    React.createElement("defs",null,
      React.createElement("linearGradient",{id:gid,x1:"0",y1:"0",x2:"0",y2:"1"},
        React.createElement("stop",{offset:"0%",stopColor:color,stopOpacity:"0.34"}),
        React.createElement("stop",{offset:"100%",stopColor:color,stopOpacity:"0.02"}))),
    [0,0.25,0.5,0.75,1].map((t,i)=>React.createElement("line",{key:i,x1:padX,y1:padTop+innerH*t,x2:W-padX,y2:padTop+innerH*t,stroke:"#f1edfc",strokeWidth:"1"})),
    React.createElement("path",{d:area,fill:"url(#"+gid+")"}),
    React.createElement("path",{d:line,fill:"none",stroke:color,strokeWidth:"3",strokeLinejoin:"round",strokeLinecap:"round"}),
    pts.map((p,i)=>React.createElement("g",{key:i},
      React.createElement("circle",{cx:p[0],cy:p[1],r:"4",fill:"#fff",stroke:color,strokeWidth:"2.5"}),
      React.createElement("text",{x:p[0],y:p[1]-12,textAnchor:"middle",fontSize:"11",fontWeight:"800",fill:"#3f3760"},fmtK(data[i].value)),
      React.createElement("text",{x:p[0],y:H-12,textAnchor:"middle",fontSize:"12",fontWeight:"600",fill:"#9a93b8"},data[i].name)))));
}

function App(){
  const[records,setRecords]=React.useState(null);
  const[partners,setPartners]=React.useState(SEED_PARTNERS);
  const[period,setPeriod]=React.useState("all");
  const[metric,setMetric]=React.useState("net");
  const[chartRange,setChartRange]=React.useState("recent");
  const[form,setForm]=React.useState(emptyForm());
  const[editingId,setEditingId]=React.useState(null);
  const[editForm,setEditForm]=React.useState(null);
  const[editingPartners,setEditingPartners]=React.useState(false);
  const[saved,setSaved]=React.useState(true);
  const recFirst=React.useRef(true);
  const partFirst=React.useRef(true);

  React.useEffect(()=>{
    (async()=>{
      try{
        let data=null;
        try{const r=await storage.get(REC_KEY);data=r?JSON.parse(r.value):null;}catch(e){}
        if(!(Array.isArray(data)&&data.length)){
          try{const o=await storage.get(OLD_KEY);const od=o?JSON.parse(o.value):null;if(Array.isArray(od)&&od.length)data=od;}catch(e){}
        }
        const finalRecs=sortRecs(Array.isArray(data)&&data.length?migrate(data):SEED);
        setRecords(finalRecs);
        if(finalRecs.length)setPeriod(finalRecs[finalRecs.length-1].id);
      }catch(e){setRecords(SEED);}
      try{
        const p=await storage.get(PARTNERS_KEY);
        const pd=p?JSON.parse(p.value):null;
        if(Array.isArray(pd)&&pd.length)setPartners(pd.map(x=>({salary:0,...x})));
      }catch(e){}
    })();
  },[]);

  React.useEffect(()=>{
    if(records===null)return;
    if(recFirst.current){recFirst.current=false;return;}
    setSaved(false);
    (async()=>{try{await storage.set(REC_KEY,JSON.stringify(records));setSaved(true);}catch(e){}})();
  },[records]);

  React.useEffect(()=>{
    if(partFirst.current){partFirst.current=false;return;}
    (async()=>{try{await storage.set(PARTNERS_KEY,JSON.stringify(partners));}catch(e){}})();
  },[partners]);

  const paidLoan=(records||[]).reduce((a,r)=>a+(Number(r.loan)||0),0);
  const paidCodes=(records||[]).reduce((a,r)=>a+(Number(r.codes)||0),0);
  
  const view2=React.useMemo(()=>{
    const recs=records||[];
    if(period==="all")return recs;
    if(typeof period==="string"&&period.startsWith("year:")){
      const y=Number(period.slice(5));return recs.filter(r=>parseMY(r.month).y===y);
    }
    return recs.filter(r=>r.id===period);
  },[records,period]);

  const totals=React.useMemo(()=>{
    const income=view2.reduce((a,r)=>a+(Number(r.income)||0),0);
    const expenses=view2.reduce((a,r)=>a+sumExpenses(r),0);
    const net=income-expenses;
    return{income,expenses,net,
      operational:view2.reduce((s,r)=>s+sumOperational(r),0),
      avg:view2.length?Math.round(net/view2.length):0,
      count:view2.length,
      byField:ALL_FIELDS.reduce((a,k)=>({...a,[k]:view2.reduce((s,r)=>s+(Number(r[k])||0),0)}),{})};
  },[view2]);

  const periodLabel=period==="all"?"كل المدة":typeof period==="string"&&period.startsWith("year:")?"سنة "+period.slice(5):(records||[]).find(r=>r.id===period)?.month?.trim()||"";

  const monthDist=r=>{
    const opNet=netProfit(r);const loss=opNet<0;
    const n=partners.length||1;const perPartner=loss?0:opNet/n;
    return{opNet,loss,perPartner,reserve:0};
  };

  const partnerTake=p=>view2.reduce((a,r)=>{
    const d=monthDist(r);return a+(d.loss?0:d.perPartner);
  },0);

  const sharePct=partners.length?Math.round(100/partners.length):0;

  const comparison=React.useMemo(()=>{
    const recs=records||[];
    if(typeof period==="string"&&period.startsWith("year:")){
      const y=Number(period.slice(5));
      const prev=recs.filter(r=>parseMY(r.month).y===y-1);
      if(!prev.length)return null;
      const curNet=recs.filter(r=>parseMY(r.month).y===y).reduce((a,r)=>a+netProfit(r),0);
      const prevNet=prev.reduce((a,r)=>a+netProfit(r),0);
      return{diff:curNet-prevNet,pct:prevNet!==0?Math.round((curNet-prevNet)/Math.abs(prevNet)*100):null,label:"مقارنة بسنة "+(y-1)};
    }
    const idx=period==="all"?(recs.length-1):recs.findIndex(r=>r.id===period);
    if(idx<=0)return null;
    const diff=netProfit(recs[idx])-netProfit(recs[idx-1]);
    const prev=netProfit(recs[idx-1]);
    return{diff,pct:prev!==0?Math.round(diff/Math.abs(prev)*100):null,label:"مقارنة بـ "+recs[idx-1].month.trim()};
  },[records,period]);

  const chartYears=React.useMemo(()=>[...new Set((records||[]).map(r=>parseMY(r.month).y).filter(Boolean))].sort((a,b)=>b-a),[records]);
  const activeMetric=METRICS.find(m=>m.key===metric);
  const chartRecords=React.useMemo(()=>{
    if(chartRange==="recent")return(records||[]).slice(-6);
    return(records||[]).filter(r=>parseMY(r.month).y===chartRange);
