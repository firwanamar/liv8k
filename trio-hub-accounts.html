<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حسابات Trio Hub</title>
<style>html,body{margin:0;padding:0}body{background:#ede7ff;-webkit-text-size-adjust:100%}</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useMemo, useRef } = React;
const { Area, AreaChart, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, LabelList } = Recharts;
const storage = { get:(k)=>{try{const v=localStorage.getItem(k);return v==null?null:{value:v};}catch(e){return null;}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}} };
const ICONS = {"wallet":"<path d=\"M21 12V7H5a2 2 0 0 1 0-4h14v4\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h16v-5\"/><path d=\"M18 12a2 2 0 0 0 0 4h4v-4Z\"/>","trending-down":"<polyline points=\"22 17 13.5 8.5 8.5 13.5 2 7\"/><polyline points=\"16 17 22 17 22 11\"/>","trending-up":"<polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"/><polyline points=\"16 7 22 7 22 13\"/>","landmark":"<line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"/><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"/><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"/><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"/><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"/><polygon points=\"12 2 20 7 4 7\"/>","code":"<path d=\"m18 16 4-4-4-4\"/><path d=\"m6 8-4 4 4 4\"/><path d=\"m14.5 4-5 16\"/>","bar-chart":"<path d=\"M3 3v18h18\"/><path d=\"M18 17V9\"/><path d=\"M13 17V5\"/><path d=\"M8 17v-3\"/>","calendar":"<path d=\"M8 2v4\"/><path d=\"M16 2v4\"/><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M3 10h18\"/>","users":"<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"/>","plus-circle":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M8 12h8\"/><path d=\"M12 8v8\"/>","list":"<path d=\"m3 17 2 2 4-4\"/><path d=\"m3 7 2 2 4-4\"/><path d=\"M13 6h8\"/><path d=\"M13 12h8\"/><path d=\"M13 18h8\"/>","pencil":"<path d=\"M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z\"/><path d=\"m15 5 4 4\"/>","activity":"<path d=\"M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2\"/>","trash":"<path d=\"M3 6h18\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/><line x1=\"10\" x2=\"10\" y1=\"11\" y2=\"17\"/><line x1=\"14\" x2=\"14\" y1=\"11\" y2=\"17\"/>"};
function Icon({ name, size = 18 }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2.2} strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: ICONS[name] || "" }} />; }


const EXPENSE_FIELDS = [
  { key: "ads", label: "رسوم الإعلانات" },
  { key: "salaries", label: "رواتب الموظفين" },
  { key: "whatsapp", label: "اشتراك الواتس اب" },
  { key: "loan", label: "قسط القرض" },
  { key: "codes", label: "دفعة الأكواد" },
  { key: "emergency", label: "دفعات طارئة" },
];
const ALL_FIELDS = ["income", ...EXPENSE_FIELDS.map((f) => f.key)];
const DEBT_KEYS = ["loan", "codes"];
const OP_KEYS = EXPENSE_FIELDS.map((f) => f.key).filter((k) => !DEBT_KEYS.includes(k));

const SEED = [
  { month: "شهر 10 - 2024", income: 128000, ads: 48000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 9 - 2024",  income: 133000, ads: 42000, salaries: 10000, whatsapp: 0,    loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 11 - 2024", income: 133000, ads: 37000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 0,     emergency: 14000 },
  { month: "شهر 12 - 2024", income: 100000, ads: 27000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 1 - 2025",  income: 116000, ads: 31000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 0,     emergency: 5800 },
  { month: "شهر 2 - 2025",  income: 139000, ads: 41000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 3 - 2025",  income: 151000, ads: 45000, salaries: 11000, whatsapp: 2200, loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 4 - 2025",  income: 151000, ads: 39000, salaries: 10000, whatsapp: 2200, loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 6 - 2025",  income: 130000, ads: 34000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 0 },
  { month: "شهر 7 - 2025",  income: 100000, ads: 32000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 0,     emergency: 0 },
  { month: "شهر 8 - 2025",  income: 200000, ads: 60000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 3300 },
  { month: "شهر 9 - 2025",  income: 215000, ads: 52000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 0 },
  { month: "شهر 10 - 2025", income: 170000, ads: 45000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 0 },
  { month: "شهر 11 - 2025", income: 125000, ads: 45000, salaries: 10000, whatsapp: 2000, loan: 0,     codes: 0,     emergency: 0 },
  { month: "شهر 12 - 2025", income: 130000, ads: 32000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 0 },
  { month: "شهر 1 - 2026",  income: 144000, ads: 35000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 29000 },
  { month: "شهر 2 - 2026",  income: 92000,  ads: 0,     salaries: 6500,  whatsapp: 0,    loan: 0,     codes: 15000, emergency: 0 },
  { month: "شهر 3 - 2026",  income: 144000, ads: 35000, salaries: 10000, whatsapp: 2000, loan: 20000, codes: 15000, emergency: 0 },
  { month: "شهر 4 - 2026",  income: 190000, ads: 46000, salaries: 6000,  whatsapp: 0,    loan: 20000, codes: 15000, emergency: 16000 },
  { month: "شهر 5 - 2026",  income: 185000, ads: 41250, salaries: 12500, whatsapp: 0,    loan: 20000, codes: 15000, emergency: 11250 },
].map((r, i) => ({ id: `seed-${i}`, ...r }));

const SEED_MONTHS = Object.fromEntries(SEED.map((r) => [r.id, r.month]));
const SEED_PARTNERS = [{ id: "p1", name: "أحمد", salary: 20000 }, { id: "p2", name: "طلال", salary: 20000 }];
const seedPaid = (key) => SEED.reduce((a, r) => a + (Number(r[key]) || 0), 0);
const SEED_DEBTS = { loan: { total: 500000, paidAnchor: 320000, base: seedPaid("loan") }, codes: { total: 350000, paidAnchor: 165000, base: seedPaid("codes") } };

const REC_KEY = "triohub_accounts_records_v2";
const OLD_KEY = "triohub_accounts_records_v1";
const PARTNERS_KEY = "triohub_partners_v1";

const CARD_ICONS = { blue: "wallet", amber: "trending-down", purple: "landmark", rose: "code", teal: "bar-chart" };
const METRICS = [
  { key: "net", label: "صافي الربح", color: "#7c5cfc" },
  { key: "income", label: "الدخل", color: "#22c55e" },
  { key: "expenses", label: "المصاريف", color: "#f59e0b" },
];

const sumExpenses = (r) => EXPENSE_FIELDS.reduce((a, f) => a + (Number(r[f.key]) || 0), 0);
const sumOperational = (r) => OP_KEYS.reduce((a, k) => a + (Number(r[k]) || 0), 0);
const netProfit = (r) => (Number(r.income) || 0) - sumExpenses(r);
const fmt = (n) => (Number(n) || 0).toLocaleString("en-US");
const parseMY = (label) => {
  const nums = (String(label).match(/\d+/g) || []).map(Number);
  return { m: nums.find((n) => n >= 1 && n <= 12) ?? nums[0] ?? null, y: nums.find((n) => n > 31) ?? null };
};
const shortMonth = (label) => String(label).replace(/\s*-?\s*\d{4}\s*$/, "").trim();
const sortRecs = (rs) => [...rs].sort((a, b) => { const A = parseMY(a.month), B = parseMY(b.month); return (A.y || 0) - (B.y || 0) || (A.m || 0) - (B.m || 0); });

const migrate = (list) =>
  list.map((r) => {
    const { installment, reserve, ...rest } = r;
    const month = SEED_MONTHS[rest.id] || rest.month;
    if (installment !== undefined && rest.loan === undefined && rest.codes === undefined) {
      const v = Number(installment) || 0;
      const loan = v >= 20000 ? 20000 : 0;
      return { ...rest, month, loan, codes: v - loan };
    }
    return { ...rest, month, loan: Number(rest.loan) || 0, codes: Number(rest.codes) || 0 };
  });

const emptyForm = () => ALL_FIELDS.reduce((a, k) => ({ ...a, [k]: "" }), { mon: "", yr: "2026" });

function MonthPicker({ records, period, onChange }) {
  const [open, setOpen] = useState(false);
  const years = [...new Set(records.map((r) => parseMY(r.month).y).filter(Boolean))].sort((a, b) => a - b);
  const [py, setPy] = useState(years[years.length - 1] || new Date().getFullYear());
  const current = period === "all" ? "كل المدة" : (typeof period === "string" && period.startsWith("year:")) ? `سنة ${period.slice(5)}` : records.find((r) => r.id === period)?.month?.trim() || "اختر";
  const recForM = (m) => records.find((r) => { const p = parseMY(r.month); return p.y === py && p.m === m; });
  return (
    <div className="th-picker">
      <button className="th-picker-btn" onClick={() => setOpen((o) => !o)}>
        <span className="th-picker-label"><Icon name="calendar" size={17} strokeWidth={2.2} /> {current}</span><span className="caret">▾</span>
      </button>
      {open && (
        <>
          <div className="th-pick-backdrop" onClick={() => setOpen(false)} />
          <div className="th-pick-pop">
            <button className={`th-pick-all ${period === "all" ? "on" : ""}`} onClick={() => { onChange("all"); setOpen(false); }}>كل المدة (كل الأشهر)</button>
            <div className="th-pick-ynav">
              <button onClick={() => setPy((y) => y - 1)}>‹</button>
              <span>{py}</span>
              <button onClick={() => setPy((y) => y + 1)}>›</button>
            </div>
            <button className={`th-pick-yearall ${period === `year:${py}` ? "on" : ""}`} onClick={() => { onChange(`year:${py}`); setOpen(false); }}>عرض كل سنة {py}</button>
            <div className="th-pick-grid">
              {Array.from({ length: 12 }, (_, i) => i + 1).map((m) => {
                const rec = recForM(m);
                const active = rec && rec.id === period;
                return (
                  <button key={m} disabled={!rec} className={`th-pick-m ${active ? "on" : ""} ${!rec ? "off" : ""}`} onClick={() => { if (rec) { onChange(rec.id); setOpen(false); } }}>
                    {m}{rec && <i />}
                  </button>
                );
              })}
            </div>
            <p className="th-pick-hint">الشهور اللي عليها نقطة فيها بيانات</p>
          </div>
        </>
      )}
    </div>
  );
}

function App() {
  const [records, setRecords] = useState(null);
  const [partners, setPartners] = useState(SEED_PARTNERS);
  const [period, setPeriod] = useState("all");
  const [metric, setMetric] = useState("net");
  const [chartRange, setChartRange] = useState("recent");
  const [form, setForm] = useState(emptyForm());
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState(null);
  const [editingPartners, setEditingPartners] = useState(false);
  const [saved, setSaved] = useState(true);
  const recFirst = useRef(true);
  const partFirst = useRef(true);

  useEffect(() => {
    (async () => {
      try {
        let data = null;
        try { const r = await storage.get(REC_KEY); data = r ? JSON.parse(r.value) : null; } catch (e) {}
        if (!(Array.isArray(data) && data.length)) {
          try { const o = await storage.get(OLD_KEY); const od = o ? JSON.parse(o.value) : null; if (Array.isArray(od) && od.length) data = od; } catch (e) {}
        }
        const finalRecs = sortRecs(Array.isArray(data) && data.length ? migrate(data) : SEED);
        setRecords(finalRecs);
        if (finalRecs.length) setPeriod(finalRecs[finalRecs.length - 1].id);
      } catch (e) { setRecords(SEED); }
      try { const p = await storage.get(PARTNERS_KEY); const pd = p ? JSON.parse(p.value) : null; if (Array.isArray(pd) && pd.length) setPartners(pd.map((x) => ({ salary: 0, ...x }))); } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    if (records === null) return;
    if (recFirst.current) { recFirst.current = false; return; }
    setSaved(false);
    (async () => { try { await storage.set(REC_KEY, JSON.stringify(records)); setSaved(true); } catch (e) {} })();
  }, [records]);

  useEffect(() => {
    if (partFirst.current) { partFirst.current = false; return; }
    (async () => { try { await storage.set(PARTNERS_KEY, JSON.stringify(partners)); } catch (e) {} })();
  }, [partners]);

  const paidLoan = (records || []).reduce((a, r) => a + (Number(r.loan) || 0), 0);
  const paidCodes = (records || []).reduce((a, r) => a + (Number(r.codes) || 0), 0);

  const view = useMemo(() => {
    const recs = records || [];
    if (period === "all") return recs;
    if (typeof period === "string" && period.startsWith("year:")) { const y = Number(period.slice(5)); return recs.filter((r) => parseMY(r.month).y === y); }
    return recs.filter((r) => r.id === period);
  }, [records, period]);

  const totals = useMemo(() => {
    const income = view.reduce((a, r) => a + (Number(r.income) || 0), 0);
    const expenses = view.reduce((a, r) => a + sumExpenses(r), 0);
    const net = income - expenses;
    return {
      income, expenses, net,
      operational: view.reduce((s, r) => s + sumOperational(r), 0),
      avg: view.length ? Math.round(net / view.length) : 0,
      count: view.length,
      byField: ALL_FIELDS.reduce((a, k) => ({ ...a, [k]: view.reduce((s, r) => s + (Number(r[k]) || 0), 0) }), {}),
    };
  }, [view]);

  const periodLabel = period === "all" ? "كل المدة" : (typeof period === "string" && period.startsWith("year:")) ? `سنة ${period.slice(5)}` : (records || []).find((r) => r.id === period)?.month?.trim() || "";

  // شلال: كل شريك بياخد مبلغ ثابت، والباقي ينزل رصيد الشركة تلقائيًا
  const monthDist = (r) => {
    const opNet = netProfit(r);
    const loss = opNet < 0;
    const n = partners.length || 1;
    const perPartner = loss ? 0 : opNet / n;
    return { opNet, loss, perPartner, reserve: 0 };
  };
  const partnerTake = (p) => view.reduce((a, r) => { const d = monthDist(r); return a + (d.loss ? 0 : d.perPartner); }, 0);
  const profitableMonths = view.filter((r) => !monthDist(r).loss).length;
  const sharePct = partners.length ? Math.round(100 / partners.length) : 0;

  const comparison = useMemo(() => {
    const recs = records || [];
    if (typeof period === "string" && period.startsWith("year:")) {
      const y = Number(period.slice(5));
      const prev = recs.filter((r) => parseMY(r.month).y === y - 1);
      if (!prev.length) return null;
      const curNet = recs.filter((r) => parseMY(r.month).y === y).reduce((a, r) => a + netProfit(r), 0);
      const prevNet = prev.reduce((a, r) => a + netProfit(r), 0);
      return { diff: curNet - prevNet, pct: prevNet !== 0 ? Math.round(((curNet - prevNet) / Math.abs(prevNet)) * 100) : null, label: `مقارنة بسنة ${y - 1}` };
    }
    const idx = period === "all" ? recs.length - 1 : recs.findIndex((r) => r.id === period);
    if (idx <= 0) return null;
    const diff = netProfit(recs[idx]) - netProfit(recs[idx - 1]);
    const prev = netProfit(recs[idx - 1]);
    return { diff, pct: prev !== 0 ? Math.round((diff / Math.abs(prev)) * 100) : null, label: `مقارنة بـ ${recs[idx - 1].month.trim()}` };
  }, [records, period]);

  const chartYears = useMemo(() => [...new Set((records || []).map((r) => parseMY(r.month).y).filter(Boolean))].sort((a, b) => b - a), [records]);
  const activeMetric = METRICS.find((m) => m.key === metric);
  const chartRecords = useMemo(() => {
    if (chartRange === "recent") return (records || []).slice(-6);
    return (records || []).filter((r) => parseMY(r.month).y === chartRange);
  }, [records, chartRange]);
  const chartData = chartRecords.map((r) => ({ name: shortMonth(r.month), value: metric === "net" ? netProfit(r) : metric === "income" ? Number(r.income) || 0 : sumExpenses(r) }));

  const liveNet = netProfit({ income: form.income, ...EXPENSE_FIELDS.reduce((a, f) => ({ ...a, [f.key]: form[f.key] }), {}) });
  const setField = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = () => {
    if (!form.mon || !form.yr) return;
    const rec = { id: `r-${Date.now()}`, month: `شهر ${form.mon} - ${form.yr}`, ...ALL_FIELDS.reduce((a, k) => ({ ...a, [k]: Number(form[k]) || 0 }), {}) };
    setRecords((rs) => sortRecs([...(rs || []), rec]));
    setForm(emptyForm());
  };
  const edit = (r) => { const my = parseMY(r.month); setEditingId(r.id); setEditForm({ id: r.id, mon: String(my.m || ""), yr: String(my.y || ""), ...ALL_FIELDS.reduce((a, k) => ({ ...a, [k]: String(r[k] ?? "") }), {}) }); };
  const setEField = (k, v) => setEditForm((f) => ({ ...f, [k]: v }));
  const saveEdit = () => {
    if (!editForm || !editForm.mon || !editForm.yr) return;
    const rec = { month: `شهر ${editForm.mon} - ${editForm.yr}`, ...ALL_FIELDS.reduce((a, k) => ({ ...a, [k]: Number(editForm[k]) || 0 }), {}) };
    setRecords((rs) => sortRecs(rs.map((r) => (r.id === editingId ? { ...r, ...rec } : r))));
    setEditingId(null); setEditForm(null);
  };
  const cancelEdit = () => { setEditingId(null); setEditForm(null); };
  const remove = (id) => setRecords((rs) => rs.filter((r) => r.id !== id));
  const resetAll = () => { if (window.confirm("هترجّع كل البيانات للأصل اللي من الاكسل؟")) { setEditingId(null); setForm(emptyForm()); setRecords(sortRecs(SEED)); } };

  const addPartner = () => setPartners((ps) => [...ps, { id: `p-${Date.now()}`, name: "شريك جديد", salary: 0 }]);
  const updPartner = (id, k, v) => setPartners((ps) => ps.map((p) => (p.id === id ? { ...p, [k]: v } : p)));
  const delPartner = (id) => setPartners((ps) => ps.filter((p) => p.id !== id));

  const exportCSV = () => {
    const head = ["الشهر", "الدخل الشهري", ...EXPENSE_FIELDS.map((f) => f.label), "صافي الربح", "نصيب كل شريك"];
    const rows = (records || []).map((r) => [r.month, r.income, ...EXPENSE_FIELDS.map((f) => r[f.key] || 0), netProfit(r), Math.round(monthDist(r).perPartner)]);
    const csv = "\uFEFF" + [head, ...rows].map((r) => r.join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a"); a.href = url; a.download = "حسابات_trio_hub.csv"; a.click(); URL.revokeObjectURL(url);
  };

  const hour = new Date().getHours();
  const greet = hour < 12 ? "صباح الخير" : hour < 17 ? "نهارك سعيد" : "مساء الخير";
  let today = "";
  try { today = new Date().toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); } catch (e) {}

  if (records === null) return (<div className="th-root th-center" dir="rtl"><style>{CSS}</style><div className="th-spinner" /></div>);

  return (
    <div className="th-root" dir="rtl">
      <style>{CSS}</style>

      <header className="th-header">
        <div className="th-greet"><p className="th-hi">{greet} 👋</p><p className="th-date">{today}</p></div>
        <div className="th-brand">
          <span className="th-status"><span className={`th-dot ${saved ? "ok" : "wait"}`} />{saved ? "محفوظ" : "جاري الحفظ…"}</span>
          <div className="th-logo">TH</div>
        </div>
      </header>

      <div className="th-hero">
        <div className="th-hero-top"><span>{periodLabel === "كل المدة" ? "صافي الربح — كل المدة" : `صافي ربح ${periodLabel}`}</span><span className="th-hero-tag">Trio Hub</span></div>
        <div className={`th-hero-val ${totals.net >= 0 ? "" : "neg"}`}>{fmt(totals.net)}</div>
        <div className="th-hero-stats">
          <div><b>{fmt(totals.income)}</b><span>الدخل</span></div>
          <div><b>{fmt(totals.expenses)}</b><span>المصاريف</span></div>
          <div>
            {comparison ? (
              <b className={`cmp ${comparison.diff >= 0 ? "up" : "down"}`}>
                {comparison.diff >= 0 ? <Icon name="trending-up" size={15} strokeWidth={2.6} /> : <Icon name="trending-down" size={15} strokeWidth={2.6} />}
                {comparison.pct !== null ? `${comparison.diff >= 0 ? "+" : ""}${comparison.pct}%` : `${comparison.diff >= 0 ? "+" : ""}${fmt(comparison.diff)}`}
              </b>
            ) : <b className="cmp flat">—</b>}

function DebtCard({ label, total, paidAnchor, base, paidNow }) {
  const t = Number(total) || 0;
  const paid = (Number(paidAnchor) || 0) + (paidNow - (Number(base) || 0));
  const remaining = t - paid;
  const pct = t > 0 ? Math.min(100, Math.max(0, Math.round((paid / t) * 100))) : 0;
  return (
    <div className="th-debt">
      <span className="th-debt-name">{label}</span>
      <div className="th-debt-stats">
        <div><span>أصل المبلغ</span><b>{fmt(t)}</b></div>
        <div><span>مدفوع</span><b>{fmt(Math.max(0, paid))}</b></div>
        <div><span>متبقّي</span><b className={t > 0 && remaining <= 0 ? "done" : "rem"}>{fmt(Math.max(0, remaining))}</b></div>
      </div>
      <div className="th-debt-bar"><div style={{ width: pct + "%" }} /></div>
      <span className="th-debt-pct">{`${pct}% اتسدّد${remaining <= 0 && t > 0 ? " — خلص ✓" : ""} • كل قسط جديد بينقص المتبقّي تلقائيًا`}</span>
    </div>
  );
}
function Card({ label, value, tone, plain }) {
  const Ico = CARD_ICONS[tone];
  return (
    <div className={`th-card ${tone}`}>
      <span className="th-card-ico">{Ico && <Icon name={Ico} size={19} />}</span>
      <span className="th-card-label">{label}</span>
      <span className="th-card-value">{plain ? value : fmt(value)}</span>
    </div>
  );
}
function Field({ label, hint, tone, children }) {
  return (<label className={`th-field ${tone || ""}`}><span className="th-field-label">{label}</span>{children}{hint && <span className="th-field-hint">{hint}</span>}</label>);
}

.th-debt-total { display:flex; flex-direction:column; gap:5px; }
.th-debt-total span { font-size:11.5px; color:#8b86a8; font-weight:600; }
.th-debt-total input { background:#fff; border:1.5px solid #e4dbff; border-radius:11px; padding:9px 11px; font-family:inherit; font-size:14px; font-weight:700; outline:none; color:#1e1e2e; }
.th-debt-total input:focus { border-color:#7c5cfc; }
.th-debt-stats { display:flex; gap:12px; }
.th-debt-stats > div { flex:1; display:flex; flex-direction:column; gap:1px; }
.th-debt-stats span { font-size:11px; color:#8b86a8; font-weight:500; }
.th-debt-stats b { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
.th-debt-stats b.rem { color:#dc2626; } .th-debt-stats b.done { color:#16a34a; }
.th-debt-bar { height:8px; background:#e4dbff; border-radius:999px; overflow:hidden; }
.th-debt-bar > div { height:100%; background:linear-gradient(90deg,#8b6bff,#5e3df5); border-radius:999px; transition:width .3s; }
.th-debt-pct { font-size:11px; color:#8b86a8; font-weight:600; }
.th-company { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
.th-company > div { border-radius:16px; padding:14px 16px; display:flex; flex-direction:column; gap:3px; background:#f3eeff; }
.th-company > div.dark { background:linear-gradient(150deg,#2c2742,#1e1e2e); color:#fff; }
.th-company span { font-size:12px; color:#8b86a8; font-weight:500; }
.th-company > div.dark span { color:#c9c4e0; }
.th-company b { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:#1e1e2e; }
.th-company-note { font-size:11.5px; color:#8b86a8; margin:0 0 14px; line-height:1.6; }
.th-company > div.dark b { color:#fff; }
.th-partner-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.th-partner { border-radius:18px; padding:15px; background:#f6f3ff; }
.th-partner-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
.th-avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(140deg,#8b6bff,#5e3df5); color:#fff; font-weight:800; font-size:17px; display:flex; align-items:center; justify-content:center; }
.th-partner-month { font-size:11px; font-weight:700; color:#7c5cfc; background:#ede7ff; padding:3px 9px; border-radius:999px; white-space:nowrap; }
.th-partner-name { font-weight:700; font-size:14px; color:#41527a; }
.th-partner-val { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px; }
.th-partner-val.pos { color:#16a34a; } .th-partner-val.neg { color:#dc2626; }
.th-partner-sub { font-size:11.5px; color:#8b86a8; }
.th-partner-editor { margin-top:15px; border-top:1px solid #efeafd; padding-top:13px; display:flex; flex-direction:column; gap:9px; }
.th-editor-hint { font-size:12px; color:#8b86a8; margin:0 0 4px; }
.th-partner-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.th-partner-row .pn { flex:1; min-width:120px; font-family:inherit; font-size:14px; font-weight:600; padding:10px 12px; border:1.5px solid #e4dbff; border-radius:12px; outline:none; background:#faf8ff; }
.th-partner-row .pn:focus { border-color:#7c5cfc; }
.th-partner-row .psal { display:flex; align-items:center; gap:3px; background:#faf8ff; border:1.5px solid #e4dbff; border-radius:12px; padding-left:9px; }
.th-partner-row .psal input { width:96px; border:none; background:transparent; font-family:inherit; font-size:14px; font-weight:700; padding:10px; outline:none; text-align:center; }
.th-partner-row .psal span { color:#8b86a8; font-weight:700; font-size:12px; white-space:nowrap; }
.th-partner-row .del { width:38px; height:38px; border:none; border-radius:12px; background:#fdeef0; color:#dc2626; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.th-pills { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.th-pills.years { margin-bottom:16px; }
.pill { font-family:inherit; font-size:13.5px; font-weight:700; padding:9px 18px; border-radius:999px; border:none; cursor:pointer; background:#f3eeff; color:#7a72a0; transition:.15s; }
.pill:hover { background:#e9e0ff; } .pill.on { color:#fff; }
.pill.ghost { font-size:13px; padding:8px 15px; background:#f6f3ff; }
.pill.ghost.on { background:#1e1e2e; color:#fff; }
.th-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:13px; }
.th-field { display:flex; flex-direction:column; gap:6px; }
.th-field-label { font-size:12.5px; color:#52638a; font-weight:600; }
.th-field-hint { font-size:11px; color:#9aa7c2; }
.th-field input, .th-field select { background:#faf8ff; border:1.5px solid #e4dbff; border-radius:13px; padding:12px 13px; color:#1e1e2e; font-family:inherit; font-size:15px; font-weight:700; outline:none; transition:.15s; width:100%; cursor:pointer; }
.th-field input:focus, .th-field select:focus { border-color:#7c5cfc; background:#fff; box-shadow:0 0 0 4px rgba(124,92,252,.12); }
.th-net { background:#e7f9ee; border:1.5px solid #bbecca; border-radius:13px; padding:12px 13px; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; color:#16a34a; }
.th-net.neg { background:#fdeef0; border-color:#f8c9cf; color:#dc2626; }
.th-actions { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.th-actions.inline { margin-top:0; }
.btn { font-family:inherit; font-weight:700; font-size:14px; border-radius:14px; padding:12px 22px; cursor:pointer; border:none; transition:.15s; }
.btn.sm { font-size:13px; padding:9px 15px; border-radius:12px; }
.btn.primary { background:linear-gradient(135deg,#8b6bff,#5e3df5); color:#fff; box-shadow:0 8px 20px rgba(124,92,252,.35); }
.btn.primary:hover { filter:brightness(1.05); transform:translateY(-1px); }
.btn.ghost { background:#f3eeff; color:#5b5476; } .btn.ghost:hover { background:#e9e0ff; }
.btn.outline { background:#f6f3ff; color:#5b5476; } .btn.outline:hover { background:#ede7ff; }
.btn.outline.danger { color:#dc2626; background:#fdeef0; } .btn.outline.danger:hover { background:#fbdde1; }
.th-table-wrap { overflow-x:auto; border-radius:16px; border:1px solid #efeafd; -webkit-overflow-scrolling:touch; }
.th-table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:840px; }
.th-table th { background:#f6f3ff; padding:12px 13px; text-align:right; font-weight:700; color:#8b86a8; font-size:12px; white-space:nowrap; }
.th-table th.num { text-align:left; }
.th-table td { padding:11px 13px; border-top:1px solid #f3f0fc; white-space:nowrap; }
.th-table tbody tr:hover { background:#faf8ff; }
.th-table tr.editing { background:#f3eeff; }
.th-table .num { text-align:left; font-variant-numeric:tabular-nums; }
.th-table .mn { font-weight:700; color:#1e1e2e; }
.th-table .dim { color:#8b86a8; } .th-table .bold { font-weight:800; }
.th-table .pos { color:#16a34a; } .th-table .neg { color:#dc2626; }
.th-table tfoot td { background:#f6f3ff; font-weight:800; border-top:2px solid #e4dbff; }
.th-empty { text-align:center; color:#a59fc4; padding:28px; }
.ops { display:flex; gap:6px; }
.ops button { background:#f3eeff; border:none; width:32px; height:32px; border-radius:10px; cursor:pointer; color:#5b5476; transition:.15s; display:flex; align-items:center; justify-content:center; }
.ops button:hover { background:#e9e0ff; }
.ops button.del:hover { background:#fdeef0; color:#dc2626; }
.th-chart-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.th-foot { text-align:center; font-size:11.5px; color:#a59fc4; margin-top:6px; }
.th-modal-overlay { position:fixed; inset:0; z-index:100; background:rgba(30,30,46,.5); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:16px; animation:fade .15s ease; }
@keyframes fade { from { opacity:0; } }
.th-modal { background:#fff; border-radius:24px; padding:22px clamp(16px,3vw,26px); width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 24px 60px rgba(30,30,46,.4); animation:pop .18s cubic-bezier(.2,.8,.3,1.2); }
@keyframes pop { from { transform:scale(.94); opacity:0; } }
.th-modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.th-modal-head h2 { margin:0; font-size:17px; font-weight:800; color:#1e1e2e; display:flex; align-items:center; gap:8px; }
.th-modal-x { width:34px; height:34px; border:none; border-radius:11px; background:#f3eeff; color:#5b5476; font-size:15px; cursor:pointer; flex-shrink:0; }
.th-modal-x:hover { background:#e9e0ff; }
@media (max-width:600px) {
  .th-root { padding:16px 12px 28px; }
  .th-hi { font-size:19px; } .th-hero-val { font-size:32px; }
  .th-cards { grid-template-columns:repeat(2,1fr); gap:10px; }
  .th-card-value { font-size:19px; }
  .th-partner-cards { grid-template-columns:repeat(2,1fr); }
  .th-form { grid-template-columns:repeat(2,1fr); }
  .th-panel { padding:16px 14px; }
}
`;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
